# Trecho de exemplo para JUNTAR ao perfil ativo do DeepSeek Harness (não substitui o perfil inteiro).
# Confira o formato do plugin MCP na versão instalada antes de colar. Uso defensivo.
- id: inema-navegador
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: inema-navegador
    transport: stdio
    command: npx
    # versão fixada no kit em 26/10/2026; confira a atual antes de trocar
    args: ['-y', '@playwright/mcp@0.0.83', '--isolated']
- id: inema-pesquisa
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: inema-pesquisa
    transport: streamable-http
    url: https://mcp.firecrawl.dev/v2/mcp
# O endereço acima é o modo sem chave, com limite de uso. Para uso completo, siga o OAuth ou o
# cabeçalho privado documentado pelo Firecrawl. A chave nunca entra neste arquivo.
