# Template PASSIVO do kit INEMA: uma requisição GET que só lê cabeçalhos.
# Uso: SÓ no laboratório sintético em 127.0.0.1, depois de ler este arquivo inteiro.
#   nuclei -u http://127.0.0.1:8181/ -t kit/exemplos/nuclei-cabecalhos-lab.yaml -rl 1 -c 1
# Não envia payload, não explora nada e não deve ser apontado para sistema de terceiros.
id: inema-lab-cabecalhos-de-protecao

info:
  name: Laboratório INEMA - cabeçalhos de proteção ausentes
  author: inematds
  severity: info
  description: Confere se a página do laboratório sintético envia X-Content-Type-Options e Referrer-Policy.
  tags: inema,laboratorio,cabecalhos,passivo

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    redirects: false
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "laboratorio-sintetico-inema"
      - type: dsl
        dsl:
          - "!contains(tolower(header), 'x-content-type-options: nosniff') || !contains(tolower(header), 'referrer-policy')"
